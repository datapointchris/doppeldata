version: "3"

vars:
  MATURIN_VERSION: 1.15.0

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # Syncing the library builds the Rust extension through maturin and installs
  # it in place, so the first run compiles the crates.
  setup:
    desc: Install both distributions into the workspace's virtualenv
    cmds:
      - uv sync --all-packages

  test:
    desc: Run the Rust and Python suites
    cmds:
      - cd crates && cargo test
      # pytest exits 5 when it collects nothing, which a member with no tests
      # yet is not a failure of.
      - uv run --with pytest pytest || test $? -eq 5

  lint:
    desc: Run every check without writing any file
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - task: typecheck
      - cd crates && cargo fmt --check
      - cd crates && cargo clippy --all-targets --all-features -- -D warnings

  typecheck:
    desc: Type check both distributions with mypy
    cmds:
      - uv run mypy .

  # The stub's text depends on the maturin that writes it, so MATURIN_VERSION
  # is the release validate.yml's stub check pins.
  generate:
    desc: Write the profile's JSON Schema and the extension's stub from the crates
    cmds:
      - cd crates && cargo run -q -p doppeldata-core --example print_profile_schema > ../library/src/doppeldata/schemas/profile.v1.json
      - cd library && uvx maturin@{{.MATURIN_VERSION}} generate-stubs --quiet --out src

  check-generated:
    desc: Fail when the committed schema or stub is not what the crates generate
    cmds:
      - cd crates && cargo test -q -p doppeldata-core --test profile_schema
      - cd library && out=$(mktemp -d) && uvx maturin@{{.MATURIN_VERSION}} generate-stubs --quiet --out "$out" && diff -u src/doppeldata/_core.pyi "$out/doppeldata/_core.pyi"

  format:
    desc: Apply ruff's and rustfmt's formatting and autofixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
      - cd crates && cargo fmt
