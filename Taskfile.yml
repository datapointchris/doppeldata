version: "3"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # Syncing the library builds the Rust extension through maturin and installs
  # it in place, so the first run compiles the crates.
  setup:
    desc: Install both distributions into the workspace's virtualenv
    cmds:
      - uv sync --all-packages

  test:
    desc: Run the Rust and Python suites
    cmds:
      - cd crates && cargo test
      # pytest exits 5 when it collects nothing, which a member with no tests
      # yet is not a failure of.
      - uv run --with pytest pytest || test $? -eq 5

  lint:
    desc: Run every check without writing any file
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - task: typecheck
      - cd crates && cargo fmt --check
      - cd crates && cargo clippy --all-targets --all-features -- -D warnings

  typecheck:
    desc: Type check both distributions with mypy
    cmds:
      - uv run mypy .

  generate:
    desc: Write the library's JSON Schemas and the extension's stub from the crates
    cmds:
      - cd crates && cargo run -q -p doppeldata-core --example write_schemas -- ../library/src/doppeldata/schemas
      - cd library && uv run maturin generate-stubs --quiet --out src

  check-generated:
    desc: Fail when a committed schema or the stub is not what the crates generate
    cmds:
      - cd crates && cargo test -q -p doppeldata-core --test profile_schema
      - cd library && out=$(mktemp -d) && uv run maturin generate-stubs --quiet --out "$out" && diff -u src/doppeldata/_core.pyi "$out/doppeldata/_core.pyi"

  # Timing on a shared CI runner is noise, so no workflow runs this.
  bench:
    desc: Time the engine against numpy, and its name provider against Faker and Mimesis, as one table
    silent: true
    cmds:
      - echo '| Arm | Threads | Work | Per second, range of 5 runs | Output | Load average, before and after |'
      - echo '| --- | --- | --- | --- | --- | --- |'
      - uv run benchmarks/engine_throughput.py
      - uv run benchmarks/numpy_throughput.py
      - uv run benchmarks/name_generators.py

  format:
    desc: Apply ruff's and rustfmt's formatting and autofixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
      - cd crates && cargo fmt
