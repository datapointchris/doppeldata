name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race. Both runs
# resolve the same version, and the later one fails pushing its tag.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without these, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  library-on-python-3-11:
    uses: ./.github/workflows/library-on-python-3.11.yml

  determinism-contract:
    uses: ./.github/workflows/determinism-contract.yml

  # The tag cannot be taken back, so the commit it would name builds on every
  # platform first, and generates the pinned values on each.
  build-before-tagging:
    uses: ./.github/workflows/build-library.yml

  release:
    needs: [validate, library-on-python-3-11, determinism-contract, build-before-tagging]
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write

  # The tag, not the branch, because main may already have moved past what was
  # released.
  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build-library.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}

  # In the same workflow as the release, because a tag pushed with
  # GITHUB_TOKEN starts no other workflow run. The shared workflow is a job
  # apart from the release, so the index credentials reach its steps alone.
  #
  # It skips each file the index already holds, so re-running a publish that
  # failed partway uploads the rest.
  #
  # The library's wheels come from `build`, one per platform, which is skipped
  # when the release cut nothing. The CLI is built at the tag, so
  # uv-dynamic-versioning names the tag exactly and the CLI requires the
  # library at the same version.
  publish:
    needs: [release, build]
    uses: datapointchris/reusable-workflows/.github/workflows/python-publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag }}
      artifacts: library-${{ needs.release.outputs.version }}-*
      packages: doppeldata-cli
      publish-url: https://pypi.ichrisbirch.com/
      check-url: https://pypi.ichrisbirch.com/simple/
    secrets:
      username: ${{ secrets.PYPI_ICB_USERNAME }}
      password: ${{ secrets.PYPI_ICB_PASSWORD }}
