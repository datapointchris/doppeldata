name: Build the library

# The library's wheels and sdist. A pull request builds them unstamped, so every
# row has built before a merge can tag. release.yml calls this before tagging,
# on the commit it would tag, and again after, with the tag and its version.
#
# push is left out because release.yml calls this on every push to main.

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out. Empty builds the commit that started the run.
        type: string
        default: ""
      version:
        description: The version written into crates/Cargo.toml. Empty keeps 0.0.0.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # One wheel per platform something installs on, each cp311-abi3, so it
  # installs on every Python from 3.11 up:
  #   x86_64-unknown-linux-gnu  AWS Glue, and Linux workstations. manylinux2014
  #                             is glibc 2.17, which every Glue version in
  #                             docs/aws-glue-support.md accepts.
  #   x86_64-apple-darwin       Intel Macs.
  # Anywhere else installs the sdist, which compiles the crates.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: x86_64-apple-darwin
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    # Bounds a hung run, above the slowest healthy Intel macOS build. A queued
    # job waiting for a runner is not covered.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Every platform shipping a wheel generates the pinned values, so a new
      # target cannot ship untested. determinism-contract.yml covers the rest.
      # Skipped once a release stamps the version, because the commit it builds
      # passed here before it was tagged.
      - name: Generate the determinism contract's pinned values
        if: inputs.version == ''
        working-directory: crates
        run: cargo test --release -p doppeldata-core --test determinism_contract

      - name: Write the release version into the crates
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: crates/set-version.sh "$VERSION"

      # No toolchain input. rustup reads the root rust-toolchain.toml, and a
      # second pin here would fight it.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: library
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"

      # The cargo test above runs the engine. This runs the wheel being
      # shipped, through the extension's own generation path, on Python 3.11.
      # It runs on a stamped build too, because those are the bytes released.
      - name: Generate the pinned values through the built wheel
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" library/dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" crates/check-pinned-values-through-wheel.py

      - uses: actions/upload-artifact@v7
        with:
          name: library-${{ inputs.version || 'unstamped' }}-${{ matrix.target }}
          path: library/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Write the release version into the crates
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: crates/set-version.sh "$VERSION"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: library
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: library-${{ inputs.version || 'unstamped' }}-sdist
          path: library/dist/*.tar.gz
          if-no-files-found: error
