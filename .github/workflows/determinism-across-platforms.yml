name: "Determinism: generated values on Linux x86_64, macOS x86_64 and macOS arm64"

# A dataset regenerates from its profile, seed and row count on any machine,
# so the determinism contract test pins a hash of generated values. A float
# function whose rounding varies by platform would break that pin on one
# runner only, which is why this is a matrix and validate.yml is not. The
# runners are the wheels' two platforms and Apple Silicon, which builds the
# sdist. Release builds, because the wheels are release builds.
#
# push is left out because release.yml calls this on every push to main.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  determinism-contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7

      # No toolchain step. rustup reads the repo's rust-toolchain.toml.
      - run: cargo test --release -p doppeldata-core --test determinism_contract
