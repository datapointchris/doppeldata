[workspace]
members = ["core", "python"]
resolver = "3"

# The release tag is the version. Git carries 0.0.0, and the release job sets
# the tagged version in its checkout before building, so no release commit is
# ever written back.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/datapointchris/doppeldata"
publish = false

# Dependencies build optimized in a dev build, while the workspace's own crates
# stay debuggable. fake, rand and arrow run several times slower unoptimized,
# and the determinism contract test generates every column kind across blocks.
[profile.dev.package."*"]
opt-level = 2
