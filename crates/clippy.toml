# A dataset must regenerate to the same bits on every platform, and std's
# transcendental functions may round differently by platform and Rust version.
# Every one of them that could feed a generated value goes through libm instead.
disallowed-methods = [
  { path = "f64::exp", reason = "std may round differently by platform; use libm" },
  { path = "f64::exp2", reason = "std may round differently by platform; use libm" },
  { path = "f64::exp_m1", reason = "std may round differently by platform; use libm" },
  { path = "f64::ln", reason = "std may round differently by platform; use libm" },
