[package]
name = "doppeldata-core"
description = "doppeldata's generation engine, with no Python and no I/O policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# arrow's major must be the one pyo3-arrow builds on, so a RecordBatch built here is the type a
# PyCapsule export through pyo3-arrow accepts. `cargo info pyo3-arrow` names that major.
arrow-array = "59"
arrow-buffer = "59"
arrow-cast = "59"
arrow-data = "59"
arrow-ord = "59"
arrow-schema = "59"
arrow-select = "59"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
fake = { version = "5.1.0", default-features = false }
grex = { version = "1.4.6", default-features = false }
# Every exp, log and pow that feeds a generated value is libm's, because std's are allowed to round
# differently by platform and Rust version, and a dataset must regenerate the same anywhere.
libm = "0.2.16"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
rand_regex = "0.19.0"
# A key stated unique enumerates its pattern's strings through a DFA, which holds one path per string.
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "dfa-build", "syntax"] }
regex-syntax = "0.8.9"
# preserve_order writes each published schema's properties in the model's field order, the order a
# profile file is written in. It turns on serde_json's preserve_order for the whole workspace, so a
# Value or Map that reaches bytes, a SHA-256 or Python is held as SortedKeys, which sorts its keys.
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Derives each op's and each format's discriminant from its enum, so a list of them cannot miss one.
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
arrow-ipc = "59"
rayon = "1.12.0"
serde-saphyr = "2.0.0"
