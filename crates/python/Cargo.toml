[package]
name = "doppeldata-python"
description = "The Python extension module doppeldata._core, over doppeldata-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The library name is the module's last segment, so Python imports it as
# doppeldata._core.
[lib]
name = "_core"
crate-type = ["cdylib"]

# extension-module and abi3-py311 are switched on by maturin, from the
# library's pyproject.toml, so `cargo test` here still links libpython.
[dependencies]
arrow-array = "60.1"
arrow-schema = "60.1"
doppeldata-core = { path = "../core" }
doppeldata-writers = { path = "../writers" }
# cloud-base exports the HTTP error a store's retries end on, which tells a store that stopped
# answering from one that answered with a failure.
object_store = { version = "0.14.2", features = ["cloud-base"] }
pyo3 = { version = "0.30", features = ["experimental-inspect"] }
# Tables and readers cross into Python as pyo3-arrow's own classes, which carry the Arrow PyCapsule
# interface, so the library needs no Arrow package installed. Its major must build on the arrow the
# engine pins. Its default buffer_protocol feature stays on, because the crate does not build without it.
# Arrow 60 support is on pyo3-arrow's main branch and unreleased, so this pins that commit.
pyo3-arrow = { git = "https://github.com/kylebarron/arro3", rev = "51a208fd81d3b35da54a15a860d3823748eb37e6" }
# Builds the S3 store, and calls a Python credential provider for it, so S3 credentials come from
# boto3's chain. Its default feature only warns about stores from other extensions, which the
# library never takes.
pyo3-object_store = { version = "0.13.0", default-features = false }
serde_json = "1.0.154"
