# Hand-written: the eight-column table the engine's throughput is measured on.
# No data was read, so it has no `generated` block.
profile_version: 1
kind: table
name: eight-columns
privacy:
  policy: default
  k_min: 11
  audit:
    - {column: id, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_count: 11}
    - {column: id, field: /numeric/sequence, values: 1, rule: "follows the trimmed extreme"}
    - {column: amount, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_count: 11}
    - {column: amount, field: /numeric/quantiles, values: 7, rule: "k_min rows from each end", min_count: 100001}
    - {column: amount, field: /numeric/fit, values: 3, rule: "fitted within the trimmed extremes"}
    - {column: qty, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_count: 11}
    - {column: qty, field: /numeric/quantiles, values: 6, rule: "k_min rows from each end", min_count: 100001}
    - {column: qty, field: /numeric/fit, values: 1, rule: "fitted within the trimmed extremes"}
    - {column: category, field: /string/top_values, values: 50, rule: "count >= k_min", min_count: 35000}
    - {column: ts, field: /temporal/extremes, values: 2, rule: "trimmed_k", min_count: 11}
    - {column: flag, field: /boolean, values: 2, rule: "cell >= k_min", min_count: 3000000}
    - {column: score, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_count: 11}
    - {column: score, field: /numeric/quantiles, values: 7, rule: "k_min rows from each end", min_count: 95001}
    - {column: score, field: /numeric/fit, values: 2, rule: "fitted within the trimmed extremes"}
    - {column: code, field: /string/pattern, values: 1, rule: "generalized"}
source:
  format: parquet
  compression: zstd
dataset:
  row_count: 10000000
  duplicate_row_rate: 0.0
  keys:
    primary: {columns: [id], uniqueness: 1.0}
columns:
  - name: id
    physical_type: int64
    logical_type: integer
    nullable: false
    null_rate: 0.0
    distinct: {approx: 10000000, ratio: 1.0}
    numeric:
      integral: true
      extremes: {low: 10, high: 9999989, method: trimmed_k}
      monotonic: increasing
      sequence: {start: 0, step: 1}
  - name: amount
    physical_type: float64
    logical_type: number
    nullable: false
    null_rate: 0.0
    numeric:
      integral: false
      extremes: {low: 0.1, high: 2000.0, method: trimmed_k}
      mean: 33.12
      std: 43.41
      quantiles: {p01: 1.96, p05: 3.88, p25: 10.24, p50: 20.09, p75: 39.41, p95: 104.06, p99: 205.61}
      fit: {family: lognorm, params: {s: 1.0, loc: 0.0, scale: 20.0855}}
      monotonic: none
  - name: qty
    physical_type: int64
    logical_type: integer
    nullable: false
    null_rate: 0.0
    numeric:
      integral: true
      extremes: {low: 0, high: 15, method: trimmed_k}
      mean: 4.0
      quantiles: {p05: 1, p25: 3, p50: 4, p75: 5, p95: 8, p99: 9}
      fit: {family: poisson, params: {mu: 4.0}}
      monotonic: none
  - name: category
    physical_type: string
    logical_type: string
    nullable: false
    null_rate: 0.0
    distinct: {approx: 50, ratio: 0.000005}
    string:
      # Zipf-weighted, s 1.1 over 50 values.
      top_values:
        - {value: category_00, rate: 0.2610}
        - {value: category_01, rate: 0.1218}
        - {value: category_02, rate: 0.0780}
        - {value: category_03, rate: 0.0568}
        - {value: category_04, rate: 0.0445}
        - {value: category_05, rate: 0.0364}
        - {value: category_06, rate: 0.0307}
        - {value: category_07, rate: 0.0265}
        - {value: category_08, rate: 0.0233}
        - {value: category_09, rate: 0.0207}
        - {value: category_10, rate: 0.0187}
        - {value: category_11, rate: 0.0170}
        - {value: category_12, rate: 0.0155}
        - {value: category_13, rate: 0.0143}
        - {value: category_14, rate: 0.0133}
        - {value: category_15, rate: 0.0124}
        - {value: category_16, rate: 0.0116}
        - {value: category_17, rate: 0.0109}
        - {value: category_18, rate: 0.0102}
        - {value: category_19, rate: 0.0097}
        - {value: category_20, rate: 0.0092}
        - {value: category_21, rate: 0.0087}
        - {value: category_22, rate: 0.0083}
        - {value: category_23, rate: 0.0079}
        - {value: category_24, rate: 0.0076}
        - {value: category_25, rate: 0.0073}
        - {value: category_26, rate: 0.0070}
        - {value: category_27, rate: 0.0067}
