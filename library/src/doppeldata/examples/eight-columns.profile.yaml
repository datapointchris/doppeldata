        - {value: category_43, rate: 0.0041}
        - {value: category_44, rate: 0.0040}
        - {value: category_45, rate: 0.0039}
        - {value: category_46, rate: 0.0038}
        - {value: category_47, rate: 0.0037}
        - {value: category_48, rate: 0.0036}
        - {value: category_49, rate: 0.0035}
      other_rate: 0.0
  - name: ts
    physical_type: "timestamp[us]"
    logical_type: timestamp
    nullable: false
    null_rate: 0.0
    temporal:
      # Uniform over 2025, so the extremes alone describe it.
      extremes: {low: "2025-01-01T00:00:00", high: "2025-12-31T23:59:59.999999", granularity: microsecond}
  - name: flag
    physical_type: bool
    logical_type: boolean
    nullable: false
    null_rate: 0.0
    boolean: {true_rate: 0.3}
  - name: score
    physical_type: float64
    logical_type: number
    nullable: true
    null_rate: 0.05
    numeric:
      integral: false
      extremes: {low: -4.0, high: 4.0, method: trimmed_k}
      mean: 0.0
      std: 1.0
      quantiles: {p01: -2.326, p05: -1.645, p25: -0.674, p50: 0.0, p75: 0.674, p95: 1.645, p99: 2.326}
      fit: {family: norm, params: {loc: 0.0, scale: 1.0}}
      monotonic: none
  - name: code
    physical_type: string
    logical_type: string
    nullable: false
    null_rate: 0.0
    distinct: {approx: 10000000, ratio: 1.0}
    string:
      # A random 10-character alphanumeric code, every character drawn independently.
      length: {min: 10, max: 10, mean: 10, quantiles: {p50: 10}}
      charset: {ascii: true, classes: [upper, lower, digit]}
      pattern: '^[A-Za-z0-9]{10}$'
