        - {value: category_34, rate: 0.0052}
        - {value: category_35, rate: 0.0051}
        - {value: category_36, rate: 0.0049}
        - {value: category_37, rate: 0.0048}
        - {value: category_38, rate: 0.0046}
        - {value: category_39, rate: 0.0045}
        - {value: category_40, rate: 0.0044}
