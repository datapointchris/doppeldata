# Hand-written: a medical claims table under the healthcare policy, which adds HIPAA Safe Harbor to
# the default floor. No data was read, so it holds no real value. `generated.at` alone is stated,
# because the oldest birth year the policy admits is 90 years before it.
kind: table
name: claims
generated:
  at: '2026-10-01T00:00:00Z'
privacy:
  policy: healthcare
  k_min: 11
  suppressed:
    - {column: claim_id, reason: identifier, semantic: claim_number}
    - {column: member_id, reason: identifier, semantic: health_plan_beneficiary_number}
    - {column: member_dob, reason: date_to_year}
    - {column: member_age, reason: age_over_89}
    - {column: member_zip, reason: zip_prefix, semantic: us_zip}
    - {column: rendering_npi, reason: identifier, semantic: npi}
    - {column: service_date, reason: date_to_year}
  # Every field holding a literal, the rule that admits it, and the fewest rows any of its values or cells rests on.
  audit:
    - {column: claim_id, field: /string/shapes, values: 1, rule: "count >= k_min", min_rows: 250000}
    - {column: claim_id, field: /string/pattern, values: 1, rule: "generalized"}
    - {column: member_dob, field: /temporal/extremes, values: 2, rule: "trimmed_k", min_rows: 11}
    - {column: member_dob, field: /temporal/month_fractions, values: 12, rule: "cell >= k_min", min_rows: 19200}
    - {column: member_dob, field: /temporal/weekday_fractions, values: 7, rule: "cell >= k_min", min_rows: 35625}
    - {column: member_age, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_rows: 11}
    - {column: member_age, field: /numeric/quantiles, values: 7, rule: "k_min rows from each end", min_rows: 2501}
    - {column: member_age, field: /numeric/histogram, values: 8, rule: "cell >= k_min", min_rows: 7000}
    - {column: member_zip, field: /string/prefixes, values: 11, rule: "count >= k_min", min_rows: 3000}
    - {column: member_zip, field: /string/shapes, values: 1, rule: "count >= k_min", min_rows: 250000}
    - {column: rendering_npi, field: /string/shapes, values: 1, rule: "count >= k_min", min_rows: 250000}
    - {column: service_date, field: /temporal/extremes, values: 2, rule: "trimmed_k", min_rows: 11}
    - {column: service_date, field: /temporal/month_fractions, values: 12, rule: "cell >= k_min", min_rows: 19475}
    - {column: service_date, field: /temporal/weekday_fractions, values: 7, rule: "cell >= k_min", min_rows: 10000}
    - {column: diagnosis_code, field: /string/top_values, values: 8, rule: "count >= k_min", min_rows: 5000}
    - {column: diagnosis_code, field: /string/shapes, values: 3, rule: "count >= k_min", min_rows: 35000}
    - {column: procedure_code, field: /string/top_values, values: 6, rule: "count >= k_min", min_rows: 5000}
    - {column: procedure_code, field: /string/shapes, values: 1, rule: "count >= k_min", min_rows: 250000}
    - {column: paid_amount, field: /numeric/extremes, values: 2, rule: "trimmed_k", min_rows: 11}
    - {column: paid_amount, field: /numeric/quantiles, values: 7, rule: "k_min rows from each end", min_rows: 2501}
    - {column: paid_amount, field: /numeric/fit, values: 3, rule: "fitted within the trimmed extremes"}
    - {column: claim_status, field: /string/top_values, values: 4, rule: "count >= k_min", min_rows: 10000}
source:
  format: parquet
  compression: zstd
dataset:
  rows: 250000
  duplicate_row_fraction: 0.0
  keys:
    primary: {columns: [claim_id], uniqueness: 1.0}
columns:
  # An identifier keeps its format and no value.
  - name: claim_id
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 250000, ratio: 1.0}
    string:
      length: {min: 12, max: 12, mean: 12, quantiles: {p50: 12}}
      whitespace_edge_fraction: 0.0
      shapes: [{shape: AAA999999999, fraction: 1.0}]
      pattern: '^CLM\d{9}$'
    semantic: {type: claim_number, pack: healthcare, confidence: 0.97, detectors: [validator, name_hint], sensitivity: identifier}
    quality: {invalid_fraction: 0.0}
  # An integer identifier's extremes are the bounds of its digit counts, so it holds no literal at all.
  - name: member_id
    physical_type: int64
    logical_type: integer
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 61000, ratio: 0.244}
    numeric:
      integral: true
      extremes: {low: 10000000, high: 99999999, method: digit_bounds}
      monotonic: none
    semantic: {type: health_plan_beneficiary_number, pack: healthcare, confidence: 0.96, detectors: [validator, name_hint], sensitivity: identifier}
  # Every date keeps the years of its extremes, and a birth year more than 90 years back is written
  # as that year.
  - name: member_dob
    physical_type: date32[day]
    logical_type: date
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 24500, ratio: 0.098}
    temporal:
      extremes: {low: '1936-01-01', high: '2008-12-31', granularity: day}
      month_fractions: [0.0841, 0.0768, 0.0849, 0.0815, 0.0843, 0.0824, 0.0862, 0.0868, 0.0841, 0.0829, 0.0792, 0.0868]
      weekday_fractions: [0.1431, 0.1425, 0.1428, 0.1426, 0.1430, 0.1432, 0.1428]
      gap_fraction: 0.1056
  # Every age over 89 is counted in the last bin, from 89.5 to 90.5, and drawn as 90.
  - name: member_age
    physical_type: int32
    logical_type: integer
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 73, ratio: 0.000292}
    numeric:
      integral: true
      extremes: {low: 18, high: 90, method: trimmed_k}
      mean: 55.8
      std: 18.9
      skew: -0.15
      kurtosis: -0.8
      zero_fraction: 0.0
      negative_fraction: 0.0
      quantiles: {p01: 19, p05: 24, p25: 41, p50: 58, p75: 71, p95: 84, p99: 90}
      histogram:
        kind: equal_depth
        edges: [17.5, 29.5, 39.5, 49.5, 59.5, 69.5, 79.5, 89.5, 90.5]
        bin_rows: [30000, 28000, 32000, 40000, 45000, 40000, 28000, 7000]
      monotonic: none
  # A ZIP code keeps three-digit prefixes, and a prefix of 20,000 or fewer people is written as 000.
  # The plan's members live in ten metro areas, and the few elsewhere fall in prefixes of fewer than
  # k_min members each, which `other_fraction` holds. Its distinct count is of its prefixes.
  - name: member_zip
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 411, ratio: 0.001644}
    string:
      length: {min: 5, max: 5, mean: 5, quantiles: {p50: 5}}
      whitespace_edge_fraction: 0.0
      shapes: [{shape: '99999', fraction: 1.0}]
      prefixes:
        values:
          - {value: '100', fraction: 0.146}
          - {value: '021', fraction: 0.121}
          - {value: '606', fraction: 0.109}
          - {value: '941', fraction: 0.097}
          - {value: '770', fraction: 0.097}
          - {value: '303', fraction: 0.085}
          - {value: '191', fraction: 0.085}
          - {value: '850', fraction: 0.073}
          - {value: '980', fraction: 0.073}
          - {value: '331', fraction: 0.073}
          - {value: '000', fraction: 0.029}
        other_fraction: 0.012
        suffix: '\d{2}'
    semantic: {type: us_zip, pack: general, confidence: 1.0, detectors: [pattern, name_hint], sensitivity: quasi_identifier}
    quality: {invalid_fraction: 0.0}
  - name: rendering_npi
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 4200, ratio: 0.0168}
    string:
      length: {min: 10, max: 10, mean: 10, quantiles: {p50: 10}}
      whitespace_edge_fraction: 0.0
      shapes: [{shape: '9999999999', fraction: 1.0}]
    semantic:
      type: npi
      pack: healthcare
      confidence: 1.0
      detectors: [pattern, check_digit, name_hint]
      sensitivity: identifier
      generator_hint: {pattern: '[12]\d{9}', check_digit: npi}
    quality: {invalid_fraction: 0.0}
  - name: service_date
    physical_type: date32[day]
    logical_type: date
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 365, ratio: 0.00146}
    temporal:
      extremes: {low: '2025-01-01', high: '2025-12-31', granularity: day}
      month_fractions: [0.0832, 0.0791, 0.0874, 0.0843, 0.0851, 0.0822, 0.0815, 0.0866, 0.0838, 0.0869, 0.0820, 0.0779]
      weekday_fractions: [0.18, 0.19, 0.19, 0.18, 0.17, 0.05, 0.04]
      gap_fraction: 0.0
  - name: diagnosis_code
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 110, ratio: 0.00044}
    string:
      length: {min: 3, max: 6, mean: 5.1, quantiles: {p50: 5}}
      whitespace_edge_fraction: 0.0
      shapes:
        - {shape: A99.9, fraction: 0.62}
        - {shape: A99.99, fraction: 0.24}
        - {shape: A99, fraction: 0.14}
      top_values:
        - {value: I10, fraction: 0.11}
        - {value: E11.9, fraction: 0.09}
        - {value: E78.5, fraction: 0.07}
        - {value: Z00.00, fraction: 0.05}
        - {value: J06.9, fraction: 0.04}
        - {value: M54.50, fraction: 0.03}
        - {value: F41.9, fraction: 0.025}
        - {value: R05.9, fraction: 0.02}
      other_fraction: 0.565
    semantic:
      type: icd10cm
      pack: healthcare
      confidence: 0.6
      detectors: [pattern, name_hint]
      sensitivity: sensitive
      generator_hint: {provider: icd10cm}
    quality: {invalid_fraction: 0.0}
  - name: procedure_code
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 60, ratio: 0.00024}
    string:
      length: {min: 5, max: 5, mean: 5, quantiles: {p50: 5}}
      whitespace_edge_fraction: 0.0
      shapes: [{shape: A9999, fraction: 1.0}]
      top_values:
        - {value: G0439, fraction: 0.14}
        - {value: G0008, fraction: 0.11}
        - {value: J1100, fraction: 0.07}
        - {value: A0425, fraction: 0.06}
        - {value: J3420, fraction: 0.04}
        - {value: E0114, fraction: 0.02}
      other_fraction: 0.56
    semantic:
      type: hcpcs_level2
      pack: healthcare
      confidence: 0.6
      detectors: [pattern, name_hint]
      sensitivity: sensitive
      generator_hint: {provider: hcpcs_level2}
    quality: {invalid_fraction: 0.0}
  - name: paid_amount
    physical_type: "decimal128(10, 2)"
    logical_type: number
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 84000, ratio: 0.336}
    numeric:
      integral: false
      precision: 10
      scale: 2
      extremes: {low: 4.12, high: 18250.0, method: trimmed_k}
      mean: 412.3
      std: 1290.5
      zero_fraction: 0.0
      negative_fraction: 0.0
      quantiles: {p01: 8.4, p05: 17.9, p25: 61.2, p50: 158.0, p75: 402.5, p95: 1475.0, p99: 4810.0}
      fit: {family: lognorm, params: {s: 1.4, loc: 0.0, scale: 160.0}}
      monotonic: none
  - name: claim_status
    physical_type: string
    logical_type: string
    nullable: false
    null_fraction: 0.0
    distinct: {approx_values: 4, ratio: 0.000016}
    string:
      length: {min: 4, max: 8, mean: 4.6, quantiles: {p50: 4}}
      whitespace_edge_fraction: 0.0
      top_values:
        - {value: paid, fraction: 0.82}
        - {value: denied, fraction: 0.09}
        - {value: pending, fraction: 0.05}
        - {value: adjusted, fraction: 0.04}
      other_fraction: 0.0
